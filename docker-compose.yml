version: '3.8'

services:
  # ─── MongoDB principal (dados reais) ───────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: pairup_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: PAIRUP
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - pairup_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Aplicação principal ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - JAR_FILE=build/libs/*.jar
    container_name: pairup_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # MongoDB
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongodb:27017/PAIRUP?authSource=admin

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Cloudflare R2
      CF_R2_ENDPOINT: ${CF_R2_ENDPOINT}
      CF_R2_ACCESS_KEY: ${CF_R2_ACCESS_KEY}
      CF_R2_SECRET_KEY: ${CF_R2_SECRET_KEY}
      CF_R2_BUCKET: ${CF_R2_BUCKET}
      CF_R2_PUBLIC_URL: ${CF_R2_PUBLIC_URL:-}

      # Google OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000,http://localhost:5173}

      # Java Options
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC -Duser.timezone=UTC"

    volumes:
      - ./logs:/app/logs
    networks:
      - pairup_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Nginx para proxy reverso (opcional - produção) ───────────────────────
  nginx:
    image: nginx:alpine
    container_name: pairup_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - pairup_net
    profiles:
      - production

volumes:
  mongo_data:
    driver: local

networks:
  pairup_net:
    driver: bridge
    name: pairup_network