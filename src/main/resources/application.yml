spring:
  application:
    name: pairup
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/PAIRUP}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
      enabled: true
      resolve-lazily: true
  # Sem MAIL_HOST os e-mails ficam desligados e a aplicação funciona normalmente.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
              - openid
            redirect-uri: ${BASE_URL}/login/oauth2/code/google
            client-name: Google
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  forward-headers-strategy: native
  tomcat:
    connection-timeout: 20000
    max-http-form-post-size: 30MB
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

jwt:
  secret: ${JWT_SECRET}

cloudflare:
  r2:
    endpoint: ${CF_R2_ENDPOINT}
    access-key: ${CF_R2_ACCESS_KEY}
    secret-key: ${CF_R2_SECRET_KEY}
    bucket: ${CF_R2_BUCKET}
    public-url: ${CF_R2_PUBLIC_URL:}

notificacao:
  email:
    remetente: ${MAIL_FROM:}

file:
  compress:
    width: 800
    height: 800
    quality: 0.7

logging:
  level:
    com.example.pairup: INFO
    org.springframework.security: INFO
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always